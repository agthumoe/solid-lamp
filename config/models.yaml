# Role → model mapping. Code refers to roles only, never to model tags.
# Status: owner-confirmed initial bindings (2026-10-15, #47); evidence in docs/HARDWARE.md and the
# round-3 role packet (docs/workstreams/round3/codex/owner-decision-packet.md).
# Shared roles use the same qwen3.5:9b profile (num_ctx 16384) to avoid the measured ~3.8 s
# context-switch reload (docs/VALIDATION.md). Retained, unbound alternates (never deleted):
#   qwen3.5:4b (fast router/background triage), qwen2.5-coder:14b (no-tool code generation
#   after a Phase 7 repo-task evaluation), qwen3:8b and gemma4:12b (chat fallbacks below),
#   deepseek-r1:14b, deepseek-r1:7b, qwen2.5:7b (installed, unused).
# Domain candidates Saul, Fin-R1 and CPA-Qwen are not bound: the owner declined acquisition (#47).

ollama:
  base_url: http://localhost:11434
  openai_base_url: http://localhost:11434/v1

roles:
  chat:
    model: qwen3.5:9b
    num_ctx: 16384
    think: false # thinking is opt-in per request (latency on a 3060)
    residency: resident
    temperature: 0.6
  router:
    model: qwen3.5:9b # shared with chat; qwen3.5:4b retained as an alternate
    num_ctx: 16384
    think: false
    residency: shared
    temperature: 0.1
  coder:
    model: qwen3.5:9b # interim tool-driving coder; qwen2.5-coder:14b retained (0/18 native tool calls)
    num_ctx: 16384
    think: false
    residency: shared
    temperature: 0.2
  embed:
    model: qwen3-embedding:0.6b
    dimensions: 1024
    num_ctx: 8192
    residency: resident
    # Prefix applied to queries only, never to documents.
    query_prefix: "Instruct: Given a question, retrieve passages from personal notes and code that answer it\nQuery: "
  vision:
    model: qwen3.5:9b # shared with chat; vision task quality still unevaluated
    num_ctx: 16384
    residency: shared
  # deep: disabled until WSL RAM >= 24 GB and a benchmark proves it acceptable.
  # deep:
  #   model: qwen3.6:35b-a3b
  #   num_ctx: 16384
  #   residency: batch_only

fallbacks:
  chat: [qwen3:8b, gemma4:12b]
  embed: [nomic-embed-text] # 768-dim; explicit versioned rebuild/promotion only (ADR 0002), never query-time failover

# Explicit embedding fallback contract; never query-time failover.
fallback_embedding_options:
  nomic-embed-text:
    dimensions: 768
    num_ctx: 2048
    query_prefix: 'search_query: '
    document_prefix: 'search_document: '
