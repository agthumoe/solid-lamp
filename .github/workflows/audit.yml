name: Dependency audit
# Advisories are published independently of our changes, so this is NOT a required check:
# a new advisory must not block unrelated PRs. It runs when dependencies change and weekly.
on:
  pull_request:
    paths: ['pnpm-lock.yaml', 'package.json', '**/package.json', 'pnpm-workspace.yaml']
  push:
    branches: [main]
    paths: ['pnpm-lock.yaml', 'package.json', '**/package.json', 'pnpm-workspace.yaml']
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0; packageManager version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # The audit reads the lockfile only; nothing is installed or executed.
      - run: pnpm run deps:audit
