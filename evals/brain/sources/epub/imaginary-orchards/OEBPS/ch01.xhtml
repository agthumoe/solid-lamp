    <section id="ch01" epub:type="chapter">
      <span id="page1" epub:type="pagebreak" title="1"/>
      <h1>Planting Moonlight Apples</h1>
      <p id="p1">Moonlight apples are planted only after the third frost of an imaginary winter.</p>
      <p id="p2">Space each sapling eleven paces apart so the silver blossoms do not overlap.<a epub:type="noteref" href="#fn1">1</a></p>
      <span id="page2" epub:type="pagebreak" title="2"/>
      <figure id="fig1">
        <img src="orchard.svg" alt="A diagram of eleven-pace spacing"/>
        <figcaption>Figure 1. Eleven-pace spacing for moonlight apples.</figcaption>
      </figure>
      <aside id="fn1" epub:type="footnote"><p>Some growers prefer twelve paces in windy valleys.</p></aside>
    </section>
